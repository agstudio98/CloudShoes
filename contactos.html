<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudShoes - Contactos</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Navbar -->
    <nav class="custom-navbar">
        <div class="navbar-container">
            <a href="index.html" class="brand">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-top: -4px;"><path d="M17.5 19A3.5 3.5 0 0 0 21 15.5c0-2.79-2.54-4.5-5-4.5-.42 0-.83.07-1.22.2A5 5 0 0 0 5 13c0 2.2 1.8 4 4 4h8.5Z"/><path d="M2.5 17A4.5 4.5 0 0 1 7 12.5c.57 0 1.12.1 1.63.29A6.5 6.5 0 0 1 20 12.5"/></svg>
                CloudShoes
            </a>
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contactos.html" class="active">Contactos</a></li>
                <li><a href="tienda.html">Tienda</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container-fluid p-0">

        <!-- Hero header section -->
        <section class="hero-section" style="background-image: url('img/contacts-2.png'); min-height: 50vh;">
            <div class="hero-overlay-dark" style="background: linear-gradient(180deg, rgba(10, 11, 16, 0.4) 0%, rgba(10, 11, 16, 0.8) 100%);"></div>
            <div class="hero-content animate-fade-up text-center w-100" style="max-width: 100%; padding-top: 15vh;">
                <h1 style="font-size: 4rem;">Contáctanos</h1>
                <p>Cualquier inconveniente, duda o queja. Estamos para ayudarte.</p>
            </div>
        </section>

        <!-- Form Section -->
        <section class="contact-section" style="background-image: url('img/contacts-1.png');">
            <div class="contact-card animate-fade-up">
                <div class="contact-header">
                    <h2>Completa tus Datos</h2>
                    <p>Responderemos a tu solicitud lo antes posible.</p>
                </div>
                <form class="contact-body" onsubmit="event.preventDefault(); alert('Mensaje enviado con éxito. ¡Gracias por contactarnos!');">
                    <div class="form-group">
                        <label for="fullName">Nombre y Apellido</label>
                        <input type="text" id="fullName" class="form-control-premium" required placeholder="Ingresa tu nombre completo">
                    </div>
                    <div class="form-group">
                        <label for="issue">Inconveniente / Mensaje</label>
                        <textarea id="issue" class="form-control-premium" required placeholder="Cuéntanos cuál es tu inconveniente o consulta..."></textarea>
                    </div>
                    <button type="submit" id="check" class="btn-submit-premium mt-2">Enviar</button>
                </form>
            </div>
        </section>

    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; Ag Studio 2023 - CloudShoes</p>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Logic -->
    <script src="navbar.js"></script>
</body>
</html>
